<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugus Transfer</title>
<style>
:root{
  --bg:#0d0e10; --panel:#141619; --panel2:#1a1d21; --line:#252930; --line2:#30353d;
  --text:#e7e9ec; --muted:#8a919b; --dim:#5d636c;
  --accent:#39c6ff; --accent-d:#1f8fbf; --glow:rgba(57,198,255,.35);
  --ok:#35d39a; --err:#f0524f; --warn:#f5c451;
  --mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;width:100%;outline:none;user-select:text}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;height:62px;font-family:var(--mono);font-size:11.5px;word-break:break-all}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
/* barres de défilement fines et sombres, comme Bandua */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2e35;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:#353a43}
::-webkit-scrollbar-corner{background:transparent}

/* barre haute */
header{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0c0e}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;font-size:15px}
.logo small{font-weight:500;font-size:11px;color:var(--dim);letter-spacing:0;margin-left:2px}
.chip{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:20px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.run,.chip.wait,.chip.night{color:var(--accent);border-color:#1d4a5e;background:#0f2029}
.chip.ok{color:var(--ok);border-color:#1f5a44;background:#0f261d}
.chip.err{color:var(--err);border-color:#5e2524;background:#2a1312}
.demo{font-size:11px;color:var(--warn)}
header .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{padding:5px 9px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.5px}
.lang button.on{background:var(--panel2);color:var(--accent)}
.lang button:hover{color:var(--text)}
.ibtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-family:Georgia,serif;font-style:italic}
.ibtn:hover{color:var(--accent);border-color:var(--accent)}

/* colonnes */
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
.left{border-right:1px solid var(--line);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.right{overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
h3{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.hint{font-size:11px;color:var(--dim);margin-top:4px;min-height:15px}
.hint.bad{color:var(--err)}
.hint.good{color:var(--accent)}

.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.modes button{padding:10px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.modes button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;cursor:pointer;transition:.15s;background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.drop.has{border-style:solid;border-color:var(--line);position:relative}
.drop .src{display:flex;align-items:center;gap:8px}
.drop .src + .src{margin-top:4px}
.drop .src:first-of-type{padding-right:78px}
.drop .path{flex:1;min-width:0;overflow-wrap:anywhere}
.drop .rm{flex:none;width:20px;height:20px;border-radius:5px;color:var(--dim);font-size:11px;line-height:1}
.drop .rm:hover{color:var(--text);background:var(--line)}
.drop .multi{margin-top:8px;color:var(--dim);font-size:11px}
.clear{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);font-size:11px;font-weight:600}
.clear:hover{color:var(--text);border-color:var(--accent)}
.drop .empty{color:var(--muted);text-align:center;padding:12px 0}
.drop .empty b{display:block;color:var(--text);font-size:14px;margin-bottom:3px}
.path{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--text)}
.stats{display:flex;gap:16px;margin-top:10px;color:var(--muted);font-size:12px}
.stats b{color:var(--text);font-family:var(--mono);font-weight:600}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pick .path{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);min-height:34px}
.btn2{padding:8px 12px;border-radius:7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.btn2:hover{color:var(--text);border-color:var(--accent)}

.night{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.night.on{border-color:#1d4a5e;background:#0d171d}
.night .head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.night .head input{width:auto;accent-color:var(--accent);margin:0}
.night .head small{font-weight:500;color:var(--dim);margin-left:auto}
.night .body{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.night:not(.on) .body{opacity:.4;pointer-events:none}

.go{height:44px;border-radius:9px;background:var(--accent);color:#04151d;font-weight:800;letter-spacing:.3px;font-size:14px}
.go:hover:not(:disabled){background:#62d3ff}
.stop{height:38px;border-radius:9px;border:1px solid #5e2524;color:var(--err);font-weight:700}
.stop:hover{background:#2a1312}
.warnline{font-size:11.5px;color:var(--warn);line-height:1.5}

/* partage */
.share{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.share .k{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.share .link{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--text);background:#0a0b0c;border:1px solid var(--line);border-radius:7px;padding:9px 10px;user-select:text}
.share .code{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:1px;color:var(--accent);text-shadow:0 0 18px var(--glow);user-select:text}
.share .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.share .valid{font-size:11.5px;color:var(--dim);margin-top:10px}
.locked{border-color:#5e2524!important}

/* progression */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.pct{display:flex;align-items:baseline;gap:12px}
.pct b{font-size:40px;font-weight:300;font-family:var(--mono);letter-spacing:-1px}
.pct span{color:var(--muted);font-family:var(--mono);font-size:12px}
.track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 14px}
.track span{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .3s linear;box-shadow:0 0 12px var(--glow)}
.prog.done .track span{background:var(--ok);box-shadow:none}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.m span{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.m b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px}

.banner{border-radius:12px;padding:14px 18px;font-weight:800;letter-spacing:.4px}
.banner small{display:block;font-weight:500;letter-spacing:0;margin-top:4px;font-size:12px;opacity:.9;user-select:text}
.banner.ok{background:#0f261d;border:1px solid #1f5a44;color:var(--ok)}
.banner.err{background:#2a1312;border:1px solid #5e2524;color:var(--err)}
.banner .row{display:flex;gap:8px;margin-top:10px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:180px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;max-height:300px}
.log div{font-size:12px;padding:3px 0;color:#c3c8cf;display:grid;grid-template-columns:52px 1fr;gap:8px;user-select:text}
.log div i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}
.log .warn{color:var(--warn)}.log .err{color:var(--err)}.log .dim{color:var(--dim)}
.files div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:11.5px;padding:3px 0;align-items:center}
.files .tick{color:var(--ok);font-weight:800}
.files .p{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .s{color:var(--muted);font-family:var(--mono)}
.idle{color:var(--dim);text-align:center;padding:60px 20px;font-size:14px;line-height:1.7}
.idle b{display:block;color:var(--muted);font-size:16px;margin-bottom:6px}
.hidden{display:none!important}

/* étapes et état */
.status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:20px;border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:600;white-space:nowrap}
.step i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;background:var(--panel2);color:var(--dim)}
.step.done{color:var(--muted)}
.step.done i{background:#123444;color:var(--accent)}
.step.active{color:var(--accent);border-color:#1d4a5e;background:#0f2029}
.step.active i{background:var(--accent);color:#04151d;animation:pulse 1.4s ease-in-out infinite}
.step.ok{color:var(--ok);border-color:#1f5a44;background:#0f261d}
.step.ok i{background:var(--ok);color:#06231a}
.step.bad{color:var(--err);border-color:#5e2524;background:#2a1312}
.step.bad i{background:var(--err);color:#2a1312}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 5px rgba(57,198,255,0)}}
.phase{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5;color:var(--text)}
.phase .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:0 0 10px var(--glow);animation:blink 1.2s ease-in-out infinite}
.phase.idle .dot{animation:none;background:var(--dim);box-shadow:none}
.phase.ok .dot{animation:none;background:var(--ok);box-shadow:none}
.phase.bad .dot{animation:none;background:var(--err);box-shadow:none}
.phase small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
@keyframes blink{50%{opacity:.35}}
.pub{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--line);margin-left:8px;vertical-align:1px}
.pub.pending{color:var(--warn);border-color:#5a4a1c;background:#2a2410}
.pub.online{color:var(--accent);border-color:#1d4a5e;background:#0f2029}
.pub.slow{color:var(--warn);border-color:#5a4a1c;background:#2a2410}
.vtrack{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);margin:-4px 0 14px}
.vtrack .track{margin:0;height:5px}
.vtrack .track span{background:var(--ok);box-shadow:none}
.vtrack b{font-family:var(--mono);font-weight:500;color:var(--text)}

/* choix des fichiers */
.picker{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.picker .ph{display:flex;align-items:baseline;gap:10px}
.picker .ph b{font-size:14px}
.picker .ph small{color:var(--muted);font-size:12px}
.picker .tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{padding:4px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;font-weight:600}
.tool:hover{color:var(--text);border-color:var(--accent)}
.tool.on{color:var(--accent);border-color:#1d4a5e;background:#0f2029}
.tool.part{color:var(--accent);border-style:dashed;border-color:#1d4a5e}
.tool em{font-style:normal;font-family:var(--mono);color:var(--dim);margin-left:4px}
.tree{border:1px solid var(--line);border-radius:9px;background:#0f1113;overflow:auto;max-height:330px;padding:4px 0}
.row{display:grid;grid-template-columns:16px 18px 1fr auto;gap:6px;align-items:center;padding:3px 10px;font-size:12px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row input{width:auto;margin:0;accent-color:var(--accent);cursor:pointer}
.row .tw{color:var(--dim);font-size:10px;text-align:center}
.row .nm{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.dir .nm{color:var(--text);font-weight:600;font-family:var(--sans)}
.row.off .nm{color:var(--dim)}
.row .sz{color:var(--muted);font-family:var(--mono);font-size:11px}
.row .kd{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-left:6px;font-family:var(--sans)}
.picker .foot{display:flex;align-items:center;gap:12px}
.picker .foot .sum{flex:1;color:var(--muted);font-size:12px}
.picker .foot .sum b{color:var(--text);font-family:var(--mono);font-weight:600}
.picker .foot .go{height:38px;padding:0 18px;font-size:13px}

/* fenêtres */
.modal{position:fixed;inset:0;background:rgba(5,6,7,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50}
.box{width:min(620px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:26px 28px;user-select:text}
.box h2{font-size:22px;font-weight:800}
.box h4{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.box p{color:#c3c8cf;font-size:12.5px;line-height:1.6;margin-bottom:8px}
.box .by{color:var(--accent);font-weight:600;font-size:13px;margin-top:4px}
.box .ver{color:var(--dim);font-family:var(--mono);font-size:11px}
.box .warnbox{border-left:3px solid var(--accent);padding:10px 14px;background:#0d171d;border-radius:0 8px 8px 0}
.box .acts{display:flex;justify-content:flex-end;margin-top:22px}
.box .acts .go{padding:0 22px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
        <defs><radialGradient id="lg"><stop offset="0" stop-color="#e1f8ff"/><stop offset=".45" stop-color="#39c6ff"/><stop offset="1" stop-color="#39c6ff" stop-opacity="0"/></radialGradient></defs>
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0e10" stroke="#252930"/>
        <path d="M12 50 A34 34 0 0 1 40 30" fill="none" stroke="#39c6ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="44" cy="28" r="12" fill="url(#lg)"/>
      </svg>
      Lugus Transfer <small>by Domingo Olmo Martin</small>
    </div>
    <span class="chip" id="chip" data-i18n="ready"></span>
    <div class="sp"></div>
    <div class="lang" id="lang">
      <button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="es">ES</button>
    </div>
    <button class="ibtn" id="about" data-i18n-title="about">i</button>
  </header>

  <main>
    <section class="left">
      <div class="modes">
        <button id="modeSend" data-i18n="send"></button>
        <button id="modeRecv" data-i18n="receive"></button>
      </div>

      <!-- Envoi -->
      <div id="sendForm">
        <h3 data-i18n="what_to_send"></h3>
        <div class="drop" id="drop"></div>
        <div class="picks">
          <button class="btn2" id="pickFolder" data-i18n="pick_folder_btn"></button>
          <button class="btn2" id="pickFiles" data-i18n="pick_files_btn"></button>
        </div>
        <div class="hint" id="srcHint"></div>
        <div style="margin-top:14px">
          <label data-i18n="after_delivery"></label>
          <select id="sendAfter">
            <option value="nothing" data-i18n="end_nothing"></option>
            <option value="sleep" data-i18n="end_sleep"></option>
            <option value="shutdown" data-i18n="end_shutdown"></option>
          </select>
        </div>
      </div>

      <!-- Réception -->
      <div id="recvForm" class="hidden">
        <h3 data-i18n="link"></h3>
        <textarea id="link" spellcheck="false" data-i18n-ph="link_ph"></textarea>
        <div class="hint" id="linkHint"></div>
        <h3 style="margin-top:8px" data-i18n="code"></h3>
        <input id="code" spellcheck="false" autocomplete="off" data-i18n-ph="code_ph" style="font-family:var(--mono);font-size:16px;letter-spacing:.5px">
        <div class="hint" id="codeHint"></div>
        <h3 style="margin-top:8px" data-i18n="destination"></h3>
        <div class="pick">
          <div class="path" id="dest"></div>
          <button class="btn2" id="pickDest" data-i18n="choose"></button>
        </div>
        <div class="night" id="night" style="margin-top:14px">
          <label class="head"><input type="checkbox" id="nightOn"> <span data-i18n="noctiluca"></span><small data-i18n="noctiluca_sub"></small></label>
          <div class="body">
            <div class="start"><label data-i18n="start_at"></label><input type="time" id="startAt" value="01:00"></div>
            <div><label data-i18n="after_reception"></label>
              <select id="recvAfter">
                <option value="nothing" data-i18n="end_nothing"></option>
                <option value="sleep" data-i18n="end_sleep"></option>
                <option value="shutdown" data-i18n="end_shutdown"></option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="sp" style="flex:1"></div>
      <p class="warnline" id="lidWarn" data-i18n="lid_warning"></p>
      <button class="go" id="go"></button>
      <button class="stop hidden" id="stop" data-i18n="stop"></button>
    </section>

    <section class="right" id="right">
      <div class="idle" id="idle"></div>

      <div class="status hidden" id="status">
        <div class="steps" id="steps"></div>
        <div class="phase" id="phase"><span class="dot"></span><div><span id="phaseText"></span><small id="phaseSub"></small></div></div>
      </div>

      <div class="picker hidden" id="picker">
        <div class="ph"><b id="pickTitle"></b><small id="pickHint"></small></div>
        <div class="tools" id="pickTools"></div>
        <div class="tree" id="tree"></div>
        <div class="foot"><span class="sum" id="pickSum"></span><button class="go hidden" id="pickOk"></button></div>
      </div>

      <div class="share hidden" id="share">
        <div>
          <div class="k"><span data-i18n="share_link"></span><span class="pub pending" id="pub"></span></div>
          <div class="link" id="shareLink"></div>
          <div class="row"><button class="btn2" id="copyLink" data-i18n="copy_link"></button></div>
          <div class="k" style="margin-top:14px" data-i18n="share_code"></div>
          <div class="code" id="shareCode"></div>
          <div class="row">
            <button class="btn2" id="copyCode" data-i18n="copy_code"></button>
            <button class="btn2" id="newCode" data-i18n="new_code"></button>
          </div>
          <p class="valid" data-i18n="share_tip"></p>
        </div>
      </div>

      <div class="banner hidden" id="banner"></div>

      <div class="prog hidden" id="prog">
        <div class="pct"><b id="pct">0 %</b><span id="amount"></span></div>
        <div class="track"><span id="bar"></span></div>
        <div class="vtrack"><span id="vLabel"></span><div class="track"><span id="vbar"></span></div><b id="vpct">0 %</b></div>
        <div class="metrics">
          <div class="m"><span data-i18n="speed"></span><b id="speed">-</b></div>
          <div class="m"><span data-i18n="remaining"></span><b id="eta">-</b></div>
          <div class="m"><span data-i18n="elapsed"></span><b id="elapsed">-</b></div>
