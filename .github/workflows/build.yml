name: Compilation

# Se lance :
#  - à la publication d'une Release sur GitHub (les fichiers y sont alors attachés automatiquement) ;
#  - à la main (onglet Actions > Compilation > Run workflow) pour un simple test, sans Release.
# Jamais à chaque push.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release existante à compléter (ex. v0.1.0), vide pour un simple test"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # L'application Tauri demande WebKitGTK sous Linux : seul le moteur est testé ici.
      - run: cargo test --workspace --exclude lugus-app

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tauri_args: ""
          - name: macOS (universel)
            os: macos-latest
            tauri_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Tests du moteur
        run: cargo test --workspace --exclude lugus-app

      # Ligne de commande
      - name: CLI Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p lugus-cli
          mkdir -p dist && cp target/release/lugus.exe "dist/lugus_$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)_windows.exe"
      - name: CLI macOS universel
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p lugus-cli --target aarch64-apple-darwin
          cargo build --release -p lugus-cli --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output "dist/lugus_$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)_macos" \
            target/aarch64-apple-darwin/release/lugus \
            target/x86_64-apple-darwin/release/lugus

      # Application
      - name: CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Application
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.tauri_args }}
      - name: Exe portable Windows
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/lugus-app.exe "dist/Lugus_Transfer_$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)_portable.exe"
      # GitHub remplace les espaces des noms de fichiers par des points : on les
      # remplace nous-mêmes par des tirets bas (Lugus_Transfer_0.1.0_x64-setup.exe).
      # find plutôt que globstar : le bash de macOS (3.2) ne le connaît pas.
      - name: Rassembler les fichiers
        shell: bash
        run: |
          find target -path '*release/bundle/*' -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "dist/$(basename "$f" | tr ' ' '_')"
            done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: lugus-${{ runner.os }}
          path: dist/*

      - name: Attacher à la Release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          files: dist/*
