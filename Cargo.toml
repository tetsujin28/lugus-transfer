[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/noctiluca",
    "crates/auth",
    "crates/store",
    "crates/transfer",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# iroh 1.4 exige Rust 1.91 au minimum.
rust-version = "1.91"
authors = ["Domingo Olmo Martin"]
repository = "https://github.com/tetsujin28/lugus-transfer"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# rand 0.8 : même famille rand_core 0.6 que spake2.
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }

# Cryptographie
blake3 = "1"
spake2 = { version = "0.4", features = ["std"] }

# Réseau
iroh = "1.4"
iroh-mainline-address-lookup = "0.6"

lugus-auth = { path = "crates/auth" }
lugus-core = { path = "crates/core" }
lugus-noctiluca = { path = "crates/noctiluca" }
lugus-store = { path = "crates/store" }
lugus-transfer = { path = "crates/transfer" }
